<html>

    <head>
        <title>Configure Peripherals</title>

        <!-- Topcoat CSS -->
        <link rel="stylesheet" type="text/css" href="../css/topcoat-mobile-dark.css">

        <!-- CSS.gg Icons -->
        <link href='https://css.gg/css' rel='stylesheet'>

        <!-- Custom CSS -->
        <link rel="stylesheet" type="text/css" href="../css/custom.css">

        <!-- JQuery -->
        <script type="text/javascript" src="../jquery-3.6.0.min.js"></script>

        <!-- Local Styles -->
        <style>

        </style>
    </head>

    <body>
        <div class="popup-content">
            <h1>MIDI Configuration</h1>
            <table class="popup-table">
                <!-- Midi Enabled -->
                <tr>
                    <td>
                        <h3>Enabled</h3>
                    </td>
                    <td colspan="3">
                        <label class="topcoat-checkbox">
                            <input type="checkbox" id="midi-enabled">
                            <div class="topcoat-checkbox__checkmark"></div>
                        </label>
                    </td>
                </tr>
                <!-- Midi Port Select -->
                <tr>
                    <td width="40%">
                        <h3>MIDI Port</h3>
                    </td>
                    <td width="60%" colspan="3">
                        <select id="midi-port">
                            <option value="-1">None (Disabled)</option>
                        </select>
                    </td>
                </tr>
                <!-- Master PTT Midi Channel -->
                <tr id="midi-master-ptt">
                    <td>
                        <h3>Master PTT</h3>
                    </td>
                    <td>
                        <input type="text" class="topcoat-text-input midi-chan" id="midi-chan-master-ptt" readonly>
                    </td>
                    <td>
                        <input type="text" class="topcoat-text-input midi-num" id="midi-num-master-ptt" readonly>
                    </td>
                    <td>
                        <button class="topcoat-button--cta learn-cc">Learn</button>
                    </td>
                </tr>
                <!-- Master Volume Midi Channel -->
                <tr id="midi-master-vol">
                    <td>
                        <h3>Master Volume</h3>
                    </td>
                    <td>
                        <input type="text" class="topcoat-text-input midi-chan" id="midi-chan-master-vol" readonly>
                    </td>
                    <td>
                        <input type="text" class="topcoat-text-input midi-num" id="midi-num-master-vol" readonly>
                    </td>
                    <td>
                        <button class="topcoat-button--cta learn-cc">Learn</button>
                    </td>
                </tr>
            </table>

            <h1>Serial Configuration</h1>
            <table class="popup-table">
                <!-- Serial Enabled -->
                <tr>
                    <td width="50%">
                        <h3>Enabled</h3>
                    </td>
                    <td width="50%">
                        <label class="topcoat-checkbox">
                            <input type="checkbox" id="serial-enabled">
                            <div class="topcoat-checkbox__checkmark"></div>
                        </label>
                    </td>
                </tr>
                <!-- Serial Port Select Button -->
                <tr>
                    <td>
                        <h3>Serial Port</h3>
                    </td>
                    <td>
                        <select id="serial-port">
                            <option value="">None (Disabled)</option>
                        </select>
                    </td>
                </tr>
                <!-- Use Serial CTS for PTT -->
                <tr>
                    <td>
                        <h3>Control Line for PTT</h3>
                    </td>
                    <td>
                        <select id="serial-pttline">
                            <option value="-1">None (Disabled)</option>
                            <option value="RI">RI (Ring Indicator)</option>
                            <option value="CTS">CTS (Clear to Send)</option>
                            <option value="DSR">DSR (Data Set Ready)</option>
                            <option value="DCD">DCD (Data Carrier Detect)</option>
                        </select>
                    </td>
                </tr>
                <!-- Save Config Button -->
                <tr>
                    <td></td>
                    <td>
                        <button class="topcoat-button--cta" id="savebtn">Save</button>
                    </td>
                </tr>
            </table>
        </div>
    </body>

    <script type="text/javascript">
        // Serial Form Fields
        let fSerialEnabled = document.getElementById("serial-enabled");
        let fSerialPort = document.getElementById("serial-port");

        // Serial controls
        let fSerialPttLine = document.getElementById("serial-pttline");
        
        // Midi Form Fields
        let fMidiEnabled = document.getElementById("midi-enabled");
        let fMidiPort = document.getElementById("midi-port");

        // Midi Channel Inputs
        let fMidiMasterPttChan = document.getElementById("midi-chan-master-ptt");
        let fMidiMasterVolChan = document.getElementById("midi-chan-master-vol");

        // Midi number inputs
        let fMidiMasterPttNum = document.getElementById("midi-num-master-ptt");
        let fMidiMasterVolNum = document.getElementById("midi-num-master-vol");

        // Save Button
        let saveButton = document.getElementById("savebtn");

        // Bind CC learn buttons
        var learnCCBtns = document.getElementsByClassName("learn-cc");
        for (var i = 0; i < learnCCBtns.length; i++)
        {
            learnCCBtns[i].addEventListener('click', learnCC);
        }

        // Whether we're learning a CC or not
        let learningCC = null;

        // Function to learn a Midi CC
        function learnCC(event)
        {
            if (learningCC == null)
            {
                // Get the CC input closest to this button
                learningCC = $(event.target).closest("tr");
                // Get the channel & number input elements
                inputChan = learningCC.find('.midi-chan');
                inputNum = learningCC.find('.midi-num');
                // Validate
                if (inputChan.attr('type') != "text" || inputNum.attr('type') != 'text')
                {
                    console.error(`Failed to get CC input to learn!`);
                    return;
                }
                // Clear current values
                inputChan.val("");
                inputNum.val("");
                console.info(`Currently learning MIDI CC for ${learningCC}`);
                // Change button color
                event.target.classList.add("button-learning");
            }
            else
            {
                // Cancel the learn
                learningCC = null;
                // Remove the button learn color
                event.target.classList.remove("button-learning");
            }
            
        }

        // Bind save
        saveButton.addEventListener('click', (event) => {
            // Prepare the config object
            periphConfig = {
                serial: {
                    enabled: fSerialEnabled.checked,
                    port: fSerialPort.value,
                    pttLine: fSerialPttLine.value
                },
                midi: {
                    enabled: fMidiEnabled.checked,
                    port: fMidiPort.value,
                    masterPtt: {
                        channel: fMidiMasterPttChan.value,
                        number: fMidiMasterPttNum.value
                    },
                    masterVol: {
                        channel: fMidiMasterVolChan.value,
                        number: fMidiMasterVolNum.value
                    }
                }
            }
            console.debug("Sending new peripheral config");
            console.debug(periphConfig);
            window.electronAPI.savePeriphConfig(periphConfig);
        });

        // Handle serial ports
        window.electronAPI.gotSerialPorts((event, portList) => {
            console.debug("Got list of serial ports");
            portList.forEach((port, idx) => {
                var opt = document.createElement('option');
                opt.value = port.path;
                opt.innerHTML = `${port.friendlyName}`;
                fSerialPort.appendChild(opt);
            });
        });

        // Handle midi ports
        // Handle ports
        window.electronAPI.gotMidiPorts((event, portList) => {
            console.debug("Got list of midi ports");
            portList.forEach((port, idx) => {
                var opt = document.createElement('option');
                opt.value = port.index;
                opt.innerHTML = `${port.name}`;
                fMidiPort.appendChild(opt);
            });
        });

        // Handle midi message
        window.electronAPI.gotMidiMessage((event, message) => {
            //console.debug("Got midi message");
            //console.debug(message);
            // If we're learning a bind, get the info
            if (learningCC != null)
            {
                // Get channel and number
                inputChan = learningCC.find('.midi-chan');
                inputNum = learningCC.find('.midi-num');
                // Update values
                inputChan.val(message.chan);
                inputNum.val(message.num);
                // Log
                console.debug(`Bound ${learningCC.attr("id")} to Midi channel ${message.chan}, number ${message.num}`);
                // Cancel learn
                learningCC = null;
                // Clear button class
                $(".button-learning").removeClass("button-learning");
            }
        });

        // Handle init config
        window.electronAPI.populatePeriphConfig((event, peripherals) => {
            console.debug(`Populating initial peripheral config`);
            console.debug(peripherals);
            // Serial config first
            fSerialEnabled.checked = peripherals.serial.enabled;
            fSerialPort.value = peripherals.serial.port;
            fSerialPttLine.value = peripherals.serial.pttLine;
            // Midi Config Next
            fMidiEnabled.checked = peripherals.midi.enabled;
            fMidiPort.value = peripherals.midi.port;
            fMidiMasterPttChan.value = peripherals.midi.masterPtt.channel;
            fMidiMasterPttNum.value = peripherals.midi.masterPtt.number;
            fMidiMasterVolChan.value = peripherals.midi.masterVol.channel;
            fMidiMasterVolNum.value = peripherals.midi.masterVol.number;
        });
    </script>

</html>
